name: Windows compatibility
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'windows_launcher.py'
      - '*_windows.cmd'
      - 'requirements.lock'
      - '.github/workflows/windows-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the Windows setup helper
        shell: cmd
        run: call setup_windows.cmd --no-pause
      - run: .venv\Scripts\python.exe -m unittest discover -s tests -v
      - run: python -m py_compile windows_launcher.py
